[package]
name = "owos"
version = "0.1.0"
edition = "2024"

# Source files live at the repo root rather than src/,
# so both targets need explicit paths.
[[bin]]
name = "owos"
path = "src/main.rs"

[lib]
name = "owos"
path = "src/lib.rs"

[dependencies]
chacha20poly1305-nostd = "0.1.0"
fontdue = { version = "0.8", default-features = false }
spin = "0.12.0"
