[package]
name = "owos"
version = "0.1.0"
edition = "2024"

# Source files live at the repo root rather than src/,
# so both targets need explicit paths.
[[bin]]
name = "owos"
path = "src/main.rs"

[lib]
name = "owos"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
chacha20poly1305-nostd = "0.1.0"
fontdue = { version = "0.8", default-features = false }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", default-features = false , features = ["alloc", "derive", "serde_derive"]}
spin = "0.12.0"
